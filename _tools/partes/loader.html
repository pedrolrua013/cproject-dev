<style>
#ld{position:fixed;inset:0;z-index:9999;display:none;place-items:center;background:radial-gradient(700px 520px at 50% 42%,rgba(143,114,221,.28),transparent 70%),#1D131E;transition:opacity .6s cubic-bezier(.22,1,.36,1),visibility .6s}
.ld-on #ld{display:grid;animation:ld-seguro .5s 4.5s forwards}
.ld-off #ld{display:none}
.ld-fim #ld{opacity:0;visibility:hidden;pointer-events:none}
.ld-fim #ld .ld-c{transform:scale(1.06) translateY(-6px);transition:transform .6s cubic-bezier(.22,1,.36,1)}
.ld-on body{overflow:hidden}
.ld-fim body{overflow:auto}
@keyframes ld-seguro{to{opacity:0;visibility:hidden;pointer-events:none}}
.ld-c{display:grid;justify-items:center;gap:22px}
.ld-f{width:clamp(110px,22vw,150px);height:auto;overflow:visible;filter:drop-shadow(0 0 18px rgba(143,114,221,.55))}
.ld-liq{animation:ld-enche 1.35s cubic-bezier(.65,0,.35,1) .1s both}
.ld-onda{animation:ld-onda 1.1s linear infinite}
.ld-onda2{animation:ld-onda 1.7s linear infinite reverse;opacity:.45}
.ld-b{animation:ld-bolha 1.4s ease-in infinite;opacity:0}
.ld-b:nth-of-type(2){animation-delay:.35s}.ld-b:nth-of-type(3){animation-delay:.7s}.ld-b:nth-of-type(4){animation-delay:1.05s}
.ld-m{fill:rgba(233,243,228,.25);animation:ld-marca .3s forwards}
.ld-m:nth-of-type(1){animation-delay:.45s}.ld-m:nth-of-type(2){animation-delay:.75s}.ld-m:nth-of-type(3){animation-delay:1.05s}
.ld-logo{width:clamp(120px,26vw,150px);height:auto;opacity:0;animation:ld-sobe .6s cubic-bezier(.22,1,.36,1) .2s forwards}
.ld-p{font:500 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:#C3B1D7;opacity:0;animation:ld-sobe .6s .35s forwards}
@property --ld-n{syntax:"<integer>";inherits:false;initial-value:0}
.ld-p b{font-weight:600;color:#E9F3E4;--ld-n:0;counter-reset:n var(--ld-n);animation:ld-conta 1.35s cubic-bezier(.65,0,.35,1) .1s forwards}
.ld-p b::after{content:counter(n) "%"}
@keyframes ld-enche{from{transform:translateY(0)}to{transform:translateY(-178px)}}
@keyframes ld-onda{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes ld-bolha{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-70px)}}
@keyframes ld-marca{to{fill:#E9F3E4}}
@keyframes ld-sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ld-conta{to{--ld-n:100}}
@media (prefers-reduced-motion:reduce){.ld-liq{animation-duration:.01s}.ld-onda,.ld-onda2,.ld-b{animation:none}.ld-p b{animation-duration:.01s}}
</style>
<div id="ld" role="status" aria-live="polite" aria-label="Carregando o site da CProject">
  <div class="ld-c">
    <svg class="ld-f" viewBox="-100 -110 200 220" aria-hidden="true">
      <defs>
        <clipPath id="ld-in"><path d="M-19.4,-88 L-19.4,-32.2 L-73,80 Q-78.8,91.4 -61.3,91.4 L61.3,91.4 Q78.8,91.4 73,80 L19.4,-32.2 L19.4,-88 Z"/></clipPath>
        <linearGradient id="ld-lq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9F3E4"/><stop offset=".22" stop-color="#C3B1D7"/><stop offset=".6" stop-color="#8F72DD"/><stop offset="1" stop-color="#3B286F"/></linearGradient>
        <linearGradient id="ld-pa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9F3E4"/><stop offset=".55" stop-color="#C3B1D7"/><stop offset="1" stop-color="#E9F3E4"/></linearGradient>
      </defs>
      <path d="M-19.4,-88 L-19.4,-32.2 L-73,80 Q-78.8,91.4 -61.3,91.4 L61.3,91.4 Q78.8,91.4 73,80 L19.4,-32.2 L19.4,-88 Z" fill="rgba(195,177,215,.06)"/>
      <g clip-path="url(#ld-in)">
        <g class="ld-liq" style="transform:translateY(0)">
          <g transform="translate(0,96)">
            <path class="ld-onda2" fill="#8F72DD" d="M-150,0 q15,-7 30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 V200 H-150 Z"/>
            <path class="ld-onda" fill="url(#ld-lq)" d="M-150,2 q15,-6 30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 V200 H-150 Z"/>
            <circle class="ld-b" cx="-30" cy="60" r="3.2" fill="none" stroke="#fff" stroke-width="1.4"/>
            <circle class="ld-b" cx="12" cy="70" r="2.2" fill="none" stroke="#fff" stroke-width="1.2"/>
            <circle class="ld-b" cx="34" cy="55" r="2.8" fill="none" stroke="#fff" stroke-width="1.3"/>
            <circle class="ld-b" cx="-8" cy="80" r="1.8" fill="none" stroke="#fff" stroke-width="1"/>
          </g>
        </g>
      </g>
      <path d="M-14,-38 L-55,48" stroke="rgba(255,255,255,.18)" stroke-width="3.6" stroke-linecap="round" fill="none"/>
      <rect class="ld-m" x="6" y="40" width="15" height="4" rx="2"/><rect class="ld-m" x="6" y="12" width="15" height="4" rx="2"/><rect class="ld-m" x="6" y="-16" width="15" height="4" rx="2"/>
      <path d="M-23,-88 L-23,-34 L-77,80 Q-84,95 -62,95 L62,95 Q84,95 77,80 L23,-34 L23,-88" fill="none" stroke="url(#ld-pa)" stroke-width="6.8" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="-34" y="-100" width="68" height="12" rx="4.4" fill="none" stroke="url(#ld-pa)" stroke-width="6.8"/>
    </svg>
    <img class="ld-logo" src="/assets/brand/logo.svg" width="134" height="47" alt="CProject">
    <div class="ld-p">Carregando <b></b></div>
  </div>
</div>
